<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Anchor"><meta name="theme-color" content="#050505"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>Anchor — Bills & Savings</title><meta name="anchor-build" content="8">
<style>
:root{--bg:#050505;--card:#101010;--card2:#151515;--line:#303030;--orange:#ff6a00;--orange2:#ff8a2b;--text:#f7f7f7;--muted:#98a1b2;--green:#32d583;--red:#ff5d5d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#050505,#0b0b0b);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 16px 105px}header{display:flex;align-items:center;gap:14px;padding:8px 4px 20px;position:sticky;top:0;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);z-index:4}.anchor{font-size:35px;color:var(--orange)}h1{font-size:28px;margin:0}.spacer{flex:1}.balance{border:1px solid var(--orange);border-radius:18px;padding:8px 15px;text-align:center}.balance small{display:block;color:var(--muted);letter-spacing:2px}.balance b{font-size:25px;color:var(--orange)}button,input,select{font:inherit}.topbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.monthselect,.btn{background:#111;border:1px solid var(--line);color:#fff;border-radius:13px;padding:11px 12px}.btn{cursor:pointer}.btn.orange{border-color:var(--orange);color:var(--orange)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat,.flow,.week{background:linear-gradient(145deg,#121212,#0c0c0c);border:1px solid var(--line);border-radius:22px}.stat{padding:22px;text-align:center}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);margin-top:6px}.orangeText{color:var(--orange)!important}.flow{margin:14px 0;padding:18px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:end}.label{color:var(--muted);font-size:14px}.moneyInput,.textInput,.dateInput{width:100%;background:#080808;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:7px}.arrow{color:var(--orange);font-size:28px;padding-bottom:7px}.flow strong{font-size:24px}.week{margin:14px 0;padding:18px;border-left:5px solid var(--orange)}.weekHead{display:flex;align-items:center;gap:10px}.weekHead h2{margin:0;font-size:24px}.iconBtn{margin-left:auto;background:none;border:0;color:var(--muted);font-size:19px}.weekInputs{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:18px 0}.saveCheck{display:flex;align-items:center;gap:8px;padding-bottom:12px;color:var(--muted)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--orange)}.billHeader,.billRow{display:grid;grid-template-columns:1.5fr 1fr 1fr .55fr auto;gap:8px;align-items:center}.billHeader{color:var(--muted);font-size:12px;letter-spacing:1px;padding:8px 2px;border-bottom:1px solid var(--line)}.billRow{padding:9px 0;border-bottom:1px solid #222}.billRow input{min-width:0;background:#080808;border:1px solid #292929;color:#fff;border-radius:9px;padding:9px}.trash{background:none;border:0;color:#ff7c64;font-size:18px}.addBill{width:100%;margin:12px 0;border:1px dashed var(--orange);background:rgba(255,106,0,.06);color:var(--orange2);border-radius:14px;padding:13px;font-weight:700}.weekTotals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.weekTotals div{color:var(--muted);font-size:13px}.weekTotals b{display:block;color:#fff;font-size:18px;margin-top:4px}.savingsBox{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.savingsLine{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.deductions{margin-top:10px}.deduction{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin:7px 0}.deduction input{background:#080808;border:1px solid #292929;color:#fff;border-radius:9px;padding:9px}.smallBtn{background:#141414;border:1px solid var(--line);color:var(--orange2);border-radius:10px;padding:9px}.addWeek{width:100%;padding:14px;border-radius:15px;border:1px dashed var(--orange);background:#0d0906;color:var(--orange);font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,.96);border-top:1px solid #282828;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:55px;color:var(--muted);z-index:5}.bottom b{color:var(--orange)}.bottom span,.bottom b{cursor:pointer;user-select:none}
.bottom .navActive{color:var(--orange);font-weight:700}
.view{display:none}.view.active{display:block}
.dashboardCard{background:linear-gradient(145deg,#121212,#0c0c0c);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.dashboardCard h2{margin:0 0 14px}.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dashItem{background:#080808;border:1px solid #292929;border-radius:14px;padding:14px}
.dashItem span{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.dashItem b{font-size:20px}
.weekSummary{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.weekSummary:last-child{border-bottom:0}.weekSummary span{color:var(--muted)}.note{font-size:12px;color:var(--muted);text-align:center;margin:14px}.empty{color:var(--muted);padding:8px 0}@media(max-width:560px){.app{padding-left:12px;padding-right:12px}.stats{gap:9px}.stat{padding:17px 8px}.flow{grid-template-columns:1fr auto 1fr}.weekInputs{grid-template-columns:1fr 1fr}.saveCheck{grid-column:1/-1}.billHeader{display:none}.billRow{grid-template-columns:1fr 1fr 1fr auto}.billRow .billName{grid-column:1/-1}.weekTotals{grid-template-columns:1fr 1fr}.savingsLine{grid-template-columns:1fr 1fr}.savingsLine button{grid-column:1/-1}.deduction{grid-template-columns:1fr 95px auto}.bottom{gap:40px}}

.billLibraryForm{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:9px;align-items:end}
.billLibraryForm input,.savedBillSelect{width:100%;background:#080808;color:#fff;border:1px solid #292929;border-radius:10px;padding:10px}
.libraryRow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #222}
.libraryRow input{min-width:0;background:#080808;color:#fff;border:1px solid #292929;border-radius:9px;padding:9px}
.pickBill{margin:10px 0 2px}.pickBill .label{margin-bottom:6px}
@media(max-width:560px){.billLibraryForm{grid-template-columns:1fr 1fr}.billLibraryForm .libName{grid-column:1/-1}.billLibraryForm button{grid-column:1/-1}.libraryRow{grid-template-columns:1fr 1fr auto}.libraryRow .libName{grid-column:1/-1}.bottom{gap:20px;font-size:13px}}

</style></head><body><div class="app">
<header><div class="anchor">⚓︎</div><div><h1>Anchor</h1><div class="label">BILLS • SAVINGS</div></div><div class="spacer"></div><div class="balance"><small>BALANCE</small><b id="headerBalance">$0.00</b></div></header>
<main id="monthView" class="view active"><div class="topbar"><select id="monthSelect" class="monthselect"></select><button class="btn orange" id="addMonth">+ Month</button><button class="btn" id="backup">Backup</button></div>
<div class="stats"><div class="stat"><b id="totalBills">$0.00</b><span>Total bills</span></div><div class="stat"><b class="orangeText" id="unpaid">$0.00</b><span>Unpaid</span></div><div class="stat"><b class="orangeText" id="savedMonth">$0.00</b><span>Saved this month</span></div><div class="stat"><b class="orangeText" id="leftPlan">$0.00</b><span>Left after plan</span></div></div>
<div class="flow"><div><div class="label">Opening balance</div><input id="opening" class="moneyInput" type="number" step="0.01"></div><div class="arrow">→</div><div><div class="label">Ending balance</div><strong id="ending">$0.00</strong></div></div>
<div id="weeks"></div><button class="addWeek" id="addWeek">＋ Add Week 5 (if needed)</button><div class="note">Changes save automatically on this device.</div></main>
<main id="billListView" class="view"></main>
<main id="savingsView" class="view"></main>
<main id="overviewView" class="view"></main></div>
<nav class="bottom"><b id="navMonth" class="navActive">▣ Month</b><span id="navBillList">☷ Bill List</span><span id="navSavings">◉ Savings</span><span id="navOverview">▥ Overview</span></nav>
<script>
const KEY='anchor_black_orange_v2';
const uid=()=>{try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID()}catch(e){} return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)};
const monthSelect=document.getElementById('monthSelect'), addMonth=document.getElementById('addMonth'), backup=document.getElementById('backup'), totalBills=document.getElementById('totalBills'), unpaid=document.getElementById('unpaid'), savedMonth=document.getElementById('savedMonth'), leftPlan=document.getElementById('leftPlan'), opening=document.getElementById('opening'), ending=document.getElementById('ending'), weeks=document.getElementById('weeks'), addWeek=document.getElementById('addWeek'), headerBalance=document.getElementById('headerBalance');
const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const freshMonth=(name)=>({id:uid(),name,opening:0,weeks:[1,2,3,4].map(n=>freshWeek(n))});
const freshWeek=n=>({id:uid(),name:'Week '+n,paycheck:0,planSave:0,saved:false,bills:[],deductions:[]});
let data; try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!data||!data.months?.length){const d=new Date();data={months:[freshMonth(d.toLocaleString('default',{month:'long',year:'numeric'}))],current:0,billLibrary:[]};save()} if(!Array.isArray(data.billLibrary)){data.billLibrary=[];save()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))} function current(){return data.months[data.current]}
function totals(w){const bills=w.bills.reduce((s,b)=>s+(+b.amount||0),0), unpaid=w.bills.filter(b=>!b.paid).reduce((s,b)=>s+(+b.amount||0),0), deductions=w.deductions.reduce((s,d)=>s+(+d.amount||0),0), actual=w.saved?Math.max(0,(+w.planSave||0)-deductions):0, left=(+w.paycheck||0)-bills, after=left-(w.saved?actual:(+w.planSave||0));return{bills,unpaid,deductions,actual,left,after}}
function render(){const m=current(); monthSelect.innerHTML=data.months.map((x,i)=>`<option value="${i}" ${i===data.current?'selected':''}>${esc(x.name)}</option>`).join(''); opening.value=m.opening||''; weeks.innerHTML='';m.weeks.forEach((w,i)=>weeks.appendChild(renderWeek(w,i))); const ts=m.weeks.map(totals);const tb=ts.reduce((s,x)=>s+x.bills,0),u=ts.reduce((s,x)=>s+x.unpaid,0),saved=ts.reduce((s,x)=>s+x.actual,0),pay=m.weeks.reduce((s,w)=>s+(+w.paycheck||0),0),planned=m.weeks.reduce((s,w)=>s+(w.saved?totals(w).actual:(+w.planSave||0)),0),end=(+m.opening||0)+pay-tb-saved; totalBills.textContent=money(tb);unpaid.textContent=money(u);savedMonth.textContent=money(saved);leftPlan.textContent=money((+m.opening||0)+pay-tb-planned);ending.textContent=money(end);headerBalance.textContent=money(end);addWeek.style.display=m.weeks.length>=5?'none':'block';save()}
function renderWeek(w,i){const t=totals(w), el=document.createElement('section');el.className='week';el.innerHTML=`<div class="weekHead"><h2>${esc(w.name)}</h2>${i>3?'<button class="iconBtn delWeek">🗑</button>':''}</div><div class="weekInputs"><label><span class="label">Paycheck</span><input class="moneyInput paycheck" type="number" step="0.01" value="${w.paycheck||''}" placeholder="0.00"></label><label><span class="label">Plan to save</span><input class="moneyInput planSave" type="number" step="0.01" value="${w.planSave||''}" placeholder="0.00"></label><label class="saveCheck"><input class="saved" type="checkbox" ${w.saved?'checked':''}> ${w.saved?'Saved':'Not yet'}</label></div><div class="pickBill"><div class="label">Add from Bill List</div><select class="savedBillSelect"><option value="">Select a saved bill…</option>${data.billLibrary.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}<option value="__custom__">＋ Custom / one-time bill</option></select></div><div class="billHeader"><span>BILL</span><span>DUE</span><span>AMOUNT</span><span>PAID</span><span></span></div><div class="billRows"></div><button class="addBill">＋ Add custom bill</button><div class="weekTotals" data-week-id="${w.id}"><div>Bills<b data-total="bills">${money(t.bills)}</b></div><div>Unpaid<b class="orangeText" data-total="unpaid">${money(t.unpaid)}</b></div><div>Left over<b data-total="left">${money(t.left)}</b></div><div>Left after plan<b class="orangeText" data-total="after">${money(t.after)}</b></div><div>Actual saved<b class="orangeText" data-total="actual">${money(t.actual)}</b></div></div><div class="savingsBox"><div class="label">Savings deductions (reduces actual saved)</div><div class="deductions"></div><button class="smallBtn addDed">+ Add deduction</button></div>`;
const rows=el.querySelector('.billRows'); if(!w.bills.length) rows.innerHTML='<div class="empty">No bills yet.</div>';w.bills.forEach((b,bi)=>{const r=document.createElement('div');r.className='billRow';r.innerHTML=`<input class="billName" placeholder="Bill name" value="${esc(b.name||'')}"><input class="due" type="date" value="${b.due||''}"><input class="amt" type="number" step="0.01" value="${b.amount||''}" placeholder="0.00"><input class="paid" type="checkbox" ${b.paid?'checked':''}><button class="trash">×</button>`;r.querySelector('.billName').oninput=e=>{b.name=e.target.value;save()};r.querySelector('.due').oninput=e=>{b.due=e.target.value;save()};r.querySelector('.amt').oninput=e=>{b.amount=e.target.value;save();updateTotalsOnly()};r.querySelector('.paid').onchange=e=>{b.paid=e.target.checked;render()};r.querySelector('.trash').onclick=()=>{w.bills.splice(bi,1);render()};rows.appendChild(r)});
const ds=el.querySelector('.deductions');w.deductions.forEach((d,di)=>{const r=document.createElement('div');r.className='deduction';r.innerHTML=`<input placeholder="What was it for?" value="${esc(d.name||'')}"><input type="number" step="0.01" placeholder="0.00" value="${d.amount||''}"><button class="trash">×</button>`;const ins=r.querySelectorAll('input');ins[0].oninput=e=>{d.name=e.target.value;save()};ins[1].oninput=e=>{d.amount=e.target.value;save();updateTotalsOnly()};r.querySelector('button').onclick=()=>{w.deductions.splice(di,1);render()};ds.appendChild(r)});
const picker=el.querySelector('.savedBillSelect');picker.onchange=e=>{const id=e.target.value;if(!id)return;if(id==='__custom__'){w.bills.push({id:uid(),name:'',due:'',amount:0,paid:false})}else{const x=data.billLibrary.find(v=>v.id===id);if(x)w.bills.push({id:uid(),name:x.name||'',due:x.due||'',amount:x.amount||0,paid:false})}save();render()};
el.querySelector('.paycheck').oninput=e=>{w.paycheck=e.target.value;save();updateTotalsOnly()};el.querySelector('.planSave').oninput=e=>{w.planSave=e.target.value;save();updateTotalsOnly()};el.querySelector('.saved').onchange=e=>{w.saved=e.target.checked;render()};el.querySelector('.addBill').onclick=()=>{w.bills.push({id:uid(),name:'',due:'',amount:0,paid:false});render()};el.querySelector('.addDed').onclick=()=>{w.deductions.push({id:uid(),name:'',amount:0});render()};const dw=el.querySelector('.delWeek');if(dw)dw.onclick=()=>{if(confirm('Delete Week 5?')){m=current();m.weeks.splice(i,1);render()}};return el}
function updateTotalsOnly(){
 const m=current(),ts=m.weeks.map(totals);
 const tb=ts.reduce((s,x)=>s+x.bills,0),u=ts.reduce((s,x)=>s+x.unpaid,0),saved=ts.reduce((s,x)=>s+x.actual,0),pay=m.weeks.reduce((s,w)=>s+(+w.paycheck||0),0),planned=m.weeks.reduce((s,w)=>s+(w.saved?totals(w).actual:(+w.planSave||0)),0),end=(+m.opening||0)+pay-tb-saved;
 totalBills.textContent=money(tb);unpaid.textContent=money(u);savedMonth.textContent=money(saved);leftPlan.textContent=money((+m.opening||0)+pay-tb-planned);ending.textContent=money(end);headerBalance.textContent=money(end);
 m.weeks.forEach(w=>{
   const t=totals(w),box=document.querySelector('.weekTotals[data-week-id="'+w.id+'"]');
   if(!box)return;
   ['bills','unpaid','left','after','actual'].forEach(k=>{const el=box.querySelector('[data-total="'+k+'"]');if(el)el.textContent=money(t[k])});
 });
 refreshActiveDashboard();
}


function renderBillListView(){
 const view=document.getElementById('billListView');
 const rows=data.billLibrary.length?data.billLibrary.map((b,i)=>`<div class="libraryRow" data-lib="${i}"><input class="libName" placeholder="Bill name" value="${esc(b.name||'')}"><input class="libDue" type="date" value="${b.due||''}"><input class="libAmt" type="number" step="0.01" placeholder="Usual amount" value="${b.amount||''}"><button class="trash libDelete">×</button></div>`).join(''):'<div class="empty">No saved bills yet. Add a recurring bill below.</div>';
 view.innerHTML=`<div class="dashboardCard"><h2>Bill List</h2><div class="label" style="margin-bottom:14px">Save recurring bills once, then select them from any week. You can still change the amount or due date after adding one to a week.</div><div id="libraryRows">${rows}</div></div><div class="dashboardCard"><h2>Add saved bill</h2><div class="billLibraryForm"><input id="newLibName" class="libName" placeholder="Bill name"><input id="newLibDue" type="date"><input id="newLibAmt" type="number" step="0.01" placeholder="Usual amount"><button id="addLibBill" class="btn orange">+ Save Bill</button></div></div>`;
 view.querySelectorAll('.libraryRow').forEach(row=>{const i=+row.dataset.lib,b=data.billLibrary[i],ins=row.querySelectorAll('input');ins[0].oninput=e=>{b.name=e.target.value;save()};ins[1].oninput=e=>{b.due=e.target.value;save()};ins[2].oninput=e=>{b.amount=e.target.value;save()};row.querySelector('.libDelete').onclick=()=>{if(confirm('Delete this saved bill?')){data.billLibrary.splice(i,1);save();renderBillListView()}}});
 document.getElementById('addLibBill').onclick=()=>{const name=document.getElementById('newLibName').value.trim();if(!name){alert('Enter a bill name first.');return}data.billLibrary.push({id:uid(),name,due:document.getElementById('newLibDue').value,amount:document.getElementById('newLibAmt').value||0});save();renderBillListView()};
}

function renderSavingsView(){
 const m=current(),ts=m.weeks.map(totals);
 const planned=m.weeks.reduce((s,w)=>s+(+w.planSave||0),0);
 const deductions=ts.reduce((s,t)=>s+t.deductions,0);
 const actual=ts.reduce((s,t)=>s+t.actual,0);
 const remaining=Math.max(0,planned-actual-deductions);
 const rows=m.weeks.map(w=>{const t=totals(w);return `<div class="weekSummary"><div><b>${esc(w.name)}</b><br><span>Goal ${money(w.planSave)} · Deductions ${money(t.deductions)}</span></div><div style="text-align:right"><b class="orangeText">${money(t.actual)}</b><br><span>${w.saved?'Saved':'Not saved yet'}</span></div></div>`}).join('');
 document.getElementById('savingsView').innerHTML=`<div class="dashboardCard"><h2>${esc(m.name)} Savings</h2><div class="dashGrid"><div class="dashItem"><span>Expected savings</span><b>${money(planned)}</b></div><div class="dashItem"><span>Actual saved</span><b class="orangeText">${money(actual)}</b></div><div class="dashItem"><span>Deductions</span><b>${money(deductions)}</b></div><div class="dashItem"><span>Remaining savings goal</span><b class="orangeText">${money(remaining)}</b></div></div></div><div class="dashboardCard"><h2>Weekly savings</h2>${rows}</div>`;
}
function renderOverviewView(){
 const m=current(),ts=m.weeks.map(totals);
 const bills=ts.reduce((s,t)=>s+t.bills,0),unpaidAmt=ts.reduce((s,t)=>s+t.unpaid,0);
 const paid=Math.max(0,bills-unpaidAmt),pay=m.weeks.reduce((s,w)=>s+(+w.paycheck||0),0);
 const planned=m.weeks.reduce((s,w)=>s+(+w.planSave||0),0),actual=ts.reduce((s,t)=>s+t.actual,0);
 const afterPlan=(+m.opening||0)+pay-bills-m.weeks.reduce((s,w)=>s+(w.saved?totals(w).actual:(+w.planSave||0)),0);
 const balance=(+m.opening||0)+pay-bills-actual;
 document.getElementById('overviewView').innerHTML=`<div class="dashboardCard"><h2>${esc(m.name)} Overview</h2><div class="dashGrid"><div class="dashItem"><span>Total paychecks</span><b>${money(pay)}</b></div><div class="dashItem"><span>Total bills</span><b>${money(bills)}</b></div><div class="dashItem"><span>Paid bills</span><b>${money(paid)}</b></div><div class="dashItem"><span>Unpaid bills</span><b class="orangeText">${money(unpaidAmt)}</b></div><div class="dashItem"><span>Expected savings</span><b>${money(planned)}</b></div><div class="dashItem"><span>Actual savings</span><b class="orangeText">${money(actual)}</b></div><div class="dashItem"><span>Left after plan</span><b>${money(afterPlan)}</b></div><div class="dashItem"><span>Current balance</span><b class="orangeText">${money(balance)}</b></div></div></div>`;
}
function refreshActiveDashboard(){
 if(document.getElementById('savingsView').classList.contains('active'))renderSavingsView();
 if(document.getElementById('overviewView').classList.contains('active'))renderOverviewView();
}
function showView(name){
 ['month','billList','savings','overview'].forEach(v=>{
   document.getElementById(v+'View').classList.toggle('active',v===name);
   const nav=document.getElementById('nav'+v.charAt(0).toUpperCase()+v.slice(1));
   nav.classList.toggle('navActive',v===name);
 });
 if(name==='billList')renderBillListView();
 if(name==='savings')renderSavingsView();
 if(name==='overview')renderOverviewView();
 window.scrollTo(0,0);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('navMonth').onclick=()=>showView('month');document.getElementById('navBillList').onclick=()=>showView('billList');document.getElementById('navSavings').onclick=()=>showView('savings');document.getElementById('navOverview').onclick=()=>showView('overview');monthSelect.onchange=e=>{data.current=+e.target.value;render()};opening.oninput=e=>{current().opening=e.target.value;save();updateTotalsOnly()};addWeek.onclick=()=>{if(current().weeks.length<5){current().weeks.push(freshWeek(5));render()}};addMonth.onclick=()=>{const name=prompt('Month name (example: October 2026)');if(name && name.trim()){data.months.push(freshMonth(name.trim()));data.current=data.months.length-1;render()}};backup.onclick=()=>{try{const text=JSON.stringify(data,null,2),blob=new Blob([text],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Anchor-backup.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}catch(e){alert('Your data is still saved automatically on this device.')}};render();

if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js?v=8', {updateViaCache:'none'}).catch(function(e){console.log('SW registration failed', e);}); }); }
</script></body></html>
